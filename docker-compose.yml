version: '3.9'
services:
  backend:
    build:
      context: ./backend
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+psycopg://evidence_app:${POSTGRES_PASSWORD}@db:5432/digital_evidence_db
      SECRET_KEY: replace-me
    depends_on:
      - db
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: digital_evidence_db
      POSTGRES_USER: evidence_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
